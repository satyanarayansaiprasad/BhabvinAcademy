name = "bhavin-academy-api"
main = "index.js"
compatibility_date = "2026-02-26"
compatibility_flags = [ "nodejs_compat", "enable_nodejs_http_server_modules" ]

[build]
command = "npx esbuild entry.mjs --bundle --outfile=index.js --format=esm --platform=node --target=node20 --external:cloudflare:node"

[vars]
# Non-sensitive variables (Public)
PORT = 5000
CLIENT_URL = "https://bhavin-academy.vercel.app" # Replace with your actual frontend URL later

# Note: Sensitive secrets (MONGODB_URI, JWT_SECRET, etc.) 
# should be set via `npx wrangler secret put`
